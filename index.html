<!DOCTYPE html>

<style>
*{box-sizing:border-box;font-family:Montserrat,Arial}
body{margin:0;overflow:hidden;background:linear-gradient(135deg,#38bdf8,#1e3a8a);color:white}

body:before{
content:"";position:fixed;inset:0;
background-image:linear-gradient(#ffffff18 1px,transparent 1px),linear-gradient(90deg,#ffffff18 1px,transparent 1px);
background-size:35px 35px;
}

header{
height:80px;display:flex;align-items:center;justify-content:center;
position:relative;
background:linear-gradient(90deg,#075985,#38bdf8,#1e40af);
position:relative;z-index:5
}

.logo{
position:absolute;
left:20px;
width:85px;
height:65px;
object-fit:contain;
filter:drop-shadow(0 0 12px white);
animation:logoGlow 2s infinite alternate;
}
@keyframes logoGlow{
from{filter:drop-shadow(0 0 8px white)}
to{filter:drop-shadow(0 0 18px white)}
}
to{filter:drop-shadow(0 0 22px #facc15)}
}




.reloj{
display:none !important;
}

#panel{
position:absolute;top:80px;left:0;width:360px;bottom:0;
padding:12px;overflow:auto;z-index:4;
background:linear-gradient(#082f49,#0f172a)
}

.card{
background:linear-gradient(135deg,#172554,#164e63);
padding:12px;border-radius:14px;margin-bottom:12px;
box-shadow:0 0 15px #0284c7
}

.resumen{
background:linear-gradient(135deg,#92400e,#facc15,#854d0e);
text-align:center
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:#0005;padding:8px;border-radius:8px;font-size:12px}

button{
width:100%;padding:10px;margin:4px 0;
border:0;border-radius:10px;
background:linear-gradient(90deg,#0284c7,#38bdf8);
color:white;font-weight:bold
}

.buscar{width:100%;padding:9px;border-radius:8px;border:0}

.buscar{width:100%;padding:9px;border-radius:8px;border:0;margin-bottom:8px;font-weight:bold}
.item{
background:#111827;padding:9px;margin:6px 0;border-radius:8px;
cursor:pointer;font-size:12px
}
.realizada{border-left:5px solid #22c55e}
.pendiente{border-left:5px solid #ef4444}

#map{position:absolute;top:80px;left:360px;right:0;bottom:0;z-index:1}

.cuaderno{
width:34px;height:34px;border-radius:8px;
display:flex;align-items:center;justify-content:center;
animation:flotar 1.8s infinite;font-size:18px
}

.rojo{background:linear-gradient(#ef4444,#991b1b);box-shadow:0 0 15px red}
.verde{background:linear-gradient(#22c55e,#166534);box-shadow:0 0 15px green}

@keyframes flotar{50%{transform:translateY(-7px)}}

.exportar{
position:absolute;right:15px;bottom:15px;z-index:10;
width:55px;height:32px;border:0;border-radius:8px;
background:#facc15;color:#422006;font-weight:bold;
box-shadow:0 0 15px #facc15;overflow:hidden
}

.exportar:after{
content:"";position:absolute;left:-100%;top:0;width:40%;height:100%;
background:white8;animation:luz 2s infinite
}
@keyframes luz{to{left:150%}}


.exportar{
position:absolute;
right:15px;
bottom:15px;
z-index:3000;
width:55px;
height:32px;
border:0;
border-radius:8px;
background:#facc15;
color:#422006;
font-weight:bold;
box-shadow:0 0 15px #facc15;
cursor:pointer;
}




100%{
opacity:0;
transform:scale(.2) translate(var(--movx),var(--movy));
}
}




@keyframes energiaChispa{
0%{
opacity:1;
transform:translate(0,0) rotate(0deg) scale(1);
}
70%{
opacity:1;
}
100%{
opacity:0;
transform:
translate(var(--x),var(--y))
rotate(var(--r))
scale(.2);
}
}



@keyframes ondaEnergia{
from{
transform:scale(.2);
opacity:1;
}
to{
transform:scale(4);
opacity:0;
}
}




100%{
opacity:0;
transform:translate(var(--dx),var(--dy)) scale(0);
}
}




100%{transform:scale(5);opacity:0}
}

.chispa{
position:fixed;
width:4px;
height:4px;
border-radius:50%;
background:radial-gradient(circle,#ffffff,#fde047,#f59e0b);
pointer-events:none;
z-index:99999;
box-shadow:0 0 6px #facc15,0 0 12px #fff;
animation:particulaRapida .45s ease-out forwards;
}

@keyframes particulaRapida{
0%{
opacity:1;
transform:translate(0,0) scale(1.8);
}
100%{
opacity:0;
transform:translate(var(--x),var(--y)) scale(.1);
}
}

/* EFECTO CURSOR ENERGIA */
.cursorParticula{
position:fixed;
width:6px;
height:6px;
background:#facc15;
border-radius:50%;
pointer-events:none;
z-index:999999;
box-shadow:0 0 8px #fff,0 0 15px #facc15;
animation:salidaParticula .7s ease-out forwards;
}

@keyframes salidaParticula{
0%{
opacity:1;
transform:translate(0,0) scale(1);
}
100%{
opacity:0;
transform:translate(var(--tx),var(--ty)) scale(0);
}
}

.destelloClick{
position:fixed;
width:15px;
height:15px;
border-radius:50%;
border:2px solid #fde047;
pointer-events:none;
z-index:999998;
animation:ondaClick .5s ease-out forwards;
}

@keyframes ondaClick{
0%{opacity:1;transform:scale(.5)}
100%{opacity:0;transform:scale(4)}
}

/* VARIACION GRID PARA FIRMAS POR BASE */

/* GRID ESTETICO VISIBLE PARA LABELS */
.grid-estetico-zona{
position:relative;
overflow:hidden;
background:
linear-gradient(135deg,#38bdf8,#1d4ed8);
}

.grid-estetico-zona::before{
content:"";
position:absolute;
inset:0;

linear-gradient(rgba(255,255,255,.20) 1px, transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.20) 1px, transparent 1px);

opacity:.55;
pointer-events:none;
}

.grid-estetico-zona > *{
position:relative;
z-index:2;
}


/* GRID DIFERENTE PARA FIRMAS POR BASE */
.grid-estetico-firmas{
position:relative;
overflow:hidden;
background:
linear-gradient(135deg,#0891b2,#2563eb);
}

.grid-estetico-firmas::before{
content:"";

inset:0;

linear-gradient(rgba(255,255,255,.16) 1px, transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.16) 1px, transparent 1px);

opacity:.6;
pointer-events:none;
}

.grid-estetico-firmas > *{
position:relative;
z-index:2;
}

/* ===== REDISEÑO DASHBOARD PREMIUM ESTILO BI ===== */
/* Inspirado en dashboards corporativos: fondo oscuro, tarjetas limpias, morados/azules */

body{
background:
linear-gradient(135deg,#15102F 0%,#24165A 45%,#0D47A1 100%) !important;
color:#FFFFFF !important;
}

/* Grid tecnológico sutil */
body::before{
content:"";
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);

/* Paneles tipo dashboard */

.card,
.box,
.contenedor,

background:

border-radius:20px !important;
box-shadow:
0 15px 35px rgba(0,0,0,.25);
}

/* Encabezados estilo BI */
header,
.encabezado,
.titulo-container{
background:
linear-gradient(135deg,#2F2FE4,#2196F3,#90CAF9) !important;
color:#FFFFFF !important;
border-radius:0 0 24px 24px;

}

.titulo{

text-shadow:0 3px 8px rgba(0,0,0,.7) !important;
}

/* Tarjetas de bases */

.base-label{
background:
linear-gradient(135deg,#2F2FE4,#2196F3) !important;
color:#FFFFFF !important;
border-radius:14px !important;
box-shadow:0 8px 18px rgba(47,47,228,.35);
text-shadow:0 2px 5px rgba(0,0,0,.7) !important;
}

/* Firmas por base */
.firmas-base-header{
background:
linear-gradient(135deg,#0D47A1,#2F2FE4) !important;
color:#FFFFFF !important;
border-radius:18px 18px 0 0;
}

.buscar{
background:#FFFFFF !important;
color:#0D47A1 !important;

.firma-item,
.lista-item,
.card-firma,

linear-gradient(145deg,#FFFFFF,#E3F2FD) !important;

}

/* Estado realizado */
.realizada{
border-left-color:#2196F3 !important;
}

/* Botones estilo dashboard */
button{
background:
linear-gradient(135deg,#2F2FE4,#2196F3) !important;
color:#FFFFFF !important;
border-radius:14px !important;
box-shadow:0 8px 20px rgba(47,47,228,.4);
}

/* Efecto tarjeta */
.panel:hover,
.card:hover{
transform:translateY(-2px);
transition:.25s ease;
}

/* =========================================
   PANEL LATERAL DERECHO
========================================= */

#detalleLateral{
    position:fixed;
    top:0;
    right:-430px;

    width:400px;
    height:100vh;

    background:#0240c5;

    z-index:9999;

    box-shadow:-8px 0 30px rgba(0,0,0,.25);

    transition:right .35s ease;

    overflow-y:auto;

    font-family:Arial, sans-serif;
}

/* Cuando se abre */
#detalleLateral.activo{
    right:0;
}

/* Botón cerrar */
#cerrarDetalle{
    position:absolute;

    top:15px;
    right:15px;

    width:38px;
    height:38px;

    border:none;
    border-radius:50%;

    background:#111827 !important;
    color:white !important;

    font-size:25px;
    line-height:30px;

    cursor:pointer;

    z-index:10;

    box-shadow:0 4px 12px rgba(0,0,0,.3);
}

/* Título */
.detalleTitulo{
    padding:22px 20px 15px;

    font-size:18px;
    font-weight:bold;

    color:#ffffff;
}

/* Imagen */
.detalleImagen{
    width:100%;
    height:270px;

    overflow:hidden;

    background:#e5e7eb;
}

.detalleImagen img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

/* Contenido */
.detalleContenido{
    padding:20px;
}

/* Cada dato */
.datoDetalle{
    padding:16px 0;

    border-bottom:1px solid #e5e7eb;

    display:flex;
    flex-direction:column;

    gap:6px;
}

/* Títulos */
.datoDetalle span{
    font-size:11px;

    font-weight:bold;

    color:#ffffff;

    letter-spacing:.5px;
}

/* Información */
.datoDetalle strong{
    font-size:15px;

    color:#000000;

    line-height:1.4;
}

/* Estado pendiente */
.estadoPendiente{
    color:#dc2626 !important;
}

/* Estado realizada */
.estadoRealizada{
    color:#16a34a !important;
}

/* Animación de la imagen */
#detalleLateral.activo .detalleImagen img{
    animation:entradaImagen .5s ease;
}

@keyframes entradaImagen{

    from{
        opacity:0;
        transform:scale(1.05);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

/* En pantallas pequeñas */
@media(max-width:700px){

    #detalleLateral{
        width:90%;
        right:-95%;
    }

}

function exportarPDF(){

let lista=datos.filter(x=>x.base===base);

let avance=lista.length?Math.round(realizadas/lista.length*100):0;

return `<tr>
<td>${base}</td>
<td>${lista.length}</td>
<td>${realizadas}</td>
<td>${pendientes}</td>
<td>${avance}%</td>
</tr>`;

// Orden de firmas por estado: pendientes primero y realizadas después
function pendientePrimero(lista){
    return lista.sort(function(a,b){
        let pa = (a.estado === "pendiente" || a.realizada === false) ? 0 : 1;
        let pb = (b.estado === "pendiente" || b.realizada === false) ? 0 : 1;
        return pa - pb;
    });
}

function mostrarDetalle(p){

    // Imagen
    document.getElementById("detalleImagen").src =
        p.imagen || "ubicacion_serenazgo.png";

    // Dirección
    document.getElementById("detalleDireccion").textContent =
        p.dir || "---";

    // Base
    document.getElementById("detalleBase").textContent =
        p.base || "---";

    // Coordenadas
    document.getElementById("detalleCoordenadas").textContent =
        p.lat + " , " + p.lng;

    // Estado
    let estado = document.getElementById("detalleEstado");

    if(p.ok){

        estado.textContent = "🟢 REALIZADA";

        estado.className = "estadoRealizada";

    }else{

        estado.textContent = "🔴 PENDIENTE";

        estado.className = "estadoPendiente";

    }

    // Abrir panel
    document.getElementById("detalleLateral")
        .classList.add("activo");
}

function cerrarDetalle(){

    document.getElementById("detalleLateral")
        .classList.remove("activo");

}

function cargar(lista){
actual=lista;
capas.forEach(c=>map.removeLayer(c));
capas=[];

listaDiv.innerHTML="";

lista = [...lista].sort((a,b)=>{
let estadoA = a.ok ? 1 : 0;
let estadoB = b.ok ? 1 : 0;
return estadoA - estadoB;
});

lista.forEach(p=>{
let icon=L.divIcon({className:"",html:`<div class="cuaderno ${p.ok?"verde":"rojo"}"><img src="./assets/sereno.png" style="width:30px;height:30px;object-fit:contain;"></div>`});
let m=L.marker([p.lat,p.lng],{icon}).addTo(map);
m.bindPopup(`<b>${p.base}</b><br>${p.dir}<br>${p.ok?"🟢 REALIZADA":"🔴 PENDIENTE"}`);
/* NUEVO: clic sobre el punto */
m.on("click", function(){

    mostrarDetalle(p);

});
capas.push(m);

listaDiv.innerHTML+=`<div class="item ${p.ok?"realizada":"pendiente"}" onclick="cambiar(${datos.indexOf(p)})">${p.dir}<br>${p.ok?"🟢 REALIZADA":"🔴 PENDIENTE"}</div>`;
});

resumen(lista);
}

function resumen(l){
let r=l.filter(x=>x.ok).length;
total.textContent=l.length;
real.textContent=r;
pend.textContent=l.length-r;
avance.textContent=l.length?Math.round(r/l.length*100)+"%":"0%";
}

function cambiar(i){
datos[i].ok=!datos[i].ok;
cargar(actual);
}

function seleccionar(b){
let l=datos.filter(x=>x.base==b);
cargar(l);
map.fitBounds(L.latLngBounds(l.map(x=>[x.lat,x.lng])),{padding:[50,50]});
}

function todos(){cargar(datos)}

buscar.oninput=function(){
let t=this.value.toLowerCase();
cargar(actual.filter(x=>x.dir.toLowerCase().includes(t)));

<body>
<div class="fecha">Fecha: ${new Date().toLocaleString()}</div>
<h1>Control de Firmas de Cuaderno</h1>

<h2>Resumen por zona</h2>
<table>
<tr>
<th>Zona</th>
<th>Total</th>
<th>Realizadas</th>
<th>Pendientes</th>
<th>Avance</th>
</tr>`;

Object.keys(zonas).forEach(z=>{
 let d=zonas[z];
 let avance=d.total?Math.round((d.real/d.total)*100):0;
 html+=`
<tr>
<td>${z}</td>
<td>${d.total}</td>
<td>${d.real}</td>
<td>${d.total-d.real}</td>
<td>${avance}%</td>
</tr>`;
});

html+=`
</table>

<h2>Pendientes por firmar</h2>
<table>
<tr>
<th>Zona</th>
<th>Dirección pendiente</th>
</tr>`;

Object.keys(zonas).forEach(z=>{
 zonas[z].pedientes.forEach(dir=>{
  html+=`<tr><td>${z}</td><td class="pend">${dir}</td></tr>`;
 });
});

html+=`
</table>
</body>
</html>`;

let w=window.open("");
w.document.write(html);
w.document.close();
w.onload=function(){
 w.print();
};
}


document.addEventListener("click", function(e){

let onda=document.createElement("div");
onda.className="destelloClick";
onda.style.left=(e.clientX-8)+"px";
onda.style.top=(e.clientY-8)+"px";
document.body.appendChild(onda);

for(let i=0;i<35;i++){

let p=document.createElement("span");
p.className="cursorParticula";

p.style.left=e.clientX+"px";
p.style.top=e.clientY+"px";

let x=(Math.random()-0.5)*160;
let y=(Math.random()-0.5)*160;

p.style.setProperty("--tx",x+"px");
p.style.setProperty("--ty",y+"px");

document.body.appendChild(p);

setTimeout(function(){
p.remove();
},700);

}

setTimeout(function(){
onda.remove();
},500);

});

</script>
