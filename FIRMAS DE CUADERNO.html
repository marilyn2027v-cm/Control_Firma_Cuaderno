<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Firmas de Cuaderno GIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
/* =========================================
   ESTILOS BASE Y GRID
========================================= */
*{box-sizing:border-box;font-family:Montserrat,Arial}
body{
    margin:0;
    overflow:hidden;
    background: linear-gradient(135deg,#15102F 0%,#24165A 45%,#0D47A1 100%) !important;
    color: #FFFFFF !important;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
    linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:32px 32px;
    pointer-events:none;
    z-index:-1;
}

header{
    height:80px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:5;
    background: linear-gradient(135deg,#2F2FE4,#2196F3,#90CAF9) !important;
    border-radius:0 0 24px 24px;
    box-shadow:0 10px 30px rgba(47,47,228,.45);
}

.logo{
    position:absolute;
    left:20px;
    width:85px;
    height:65px;
    object-fit:contain;
    filter:drop-shadow(0 0 12px white);
    animation:logoGlow 2s infinite alternate;
}
@keyframes logoGlow{
    from{filter:drop-shadow(0 0 8px white)}
    to{filter:drop-shadow(0 0 18px white)}
}

.titulo{
    font-family: "Arial Black", Arial, sans-serif !important;
    font-size: 42px !important;
    font-weight: 900 !important;
    color:#FFFFFF !important;
    text-align:center;
    letter-spacing:1px;

    text-shadow:
    0 3px 8px rgba(0,0,0,.6);
}

/* =========================================
   PANELES Y TARJETAS (ESTILO BI)
========================================= */
#panel{
    position:absolute;top:80px;left:0;width:360px;bottom:0;
    padding:12px;overflow:auto;z-index:4;
}

.card{
    background: linear-gradient(145deg,rgba(255,255,255,.96),rgba(238,240,255,.95)) !important;
    color:#25175A !important;
    border:1px solid rgba(255,255,255,.7);
    border-radius:20px !important;
    box-shadow: 0 15px 35px rgba(0,0,0,.25);
    padding:12px;
    margin-bottom:12px;
    transition:.25s ease;
}

.card:hover{
    transform:translateY(-2px);
}

/* ================================
   PANEL RESUMEN DE FIRMAS MUNICIPAL
================================ */

.resumen{
    text-align:center;
    padding:16px !important;

    background:linear-gradient(
        135deg,
        #00B7CD 0%,
        #1B2CC1 100%
    ) !important;

    border-radius:24px !important;

    box-shadow:
        0 12px 30px rgba(0,0,0,.35),
        inset 0 0 20px rgba(255,255,255,.25);

    color:white !important;
}


/* Título */
.resumen h3{
    margin:5px 0 16px;

    font-size:24px;
    font-weight:900;

    color:#ffffff !important;

    letter-spacing:1.5px;

    text-transform:uppercase;

    text-shadow:
        0 3px 8px rgba(0,0,0,.35);
}


/* Cuadrícula */
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}


/* Tarjetas internas */
.stat{

    background:rgba(255,255,255,.88);

    padding:10px 5px;

    border-radius:14px;

    min-height:60px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;


    color:#1B2CC1;

    font-size:14px;

    font-weight:900;


    box-shadow:
        0 6px 15px rgba(0,0,0,.18);

}


/* Números */
.stat b{

    margin-top:4px;

    font-size:25px;

    font-weight:900;

    color:#111827;

    line-height:1;

}


/* Efecto al pasar mouse */
.stat:hover{
    transform:translateY(-3px);
    transition:.25s ease;
    box-shadow:
        0 8px 18px rgba(37,99,235,.35);
}

button{
    width:100%;padding:10px;margin:4px 0;
    border:0;
    background: linear-gradient(135deg,#2F2FE4,#2196F3) !important;
    color:#FFFFFF !important;
    border-radius:14px !important;
    box-shadow:0 8px 20px rgba(47,47,228,.4);
    font-weight:bold;
    cursor: pointer;
}
button:hover{ filter:brightness(1.1); }

.buscar{
    width:100%;padding:9px;margin-bottom:8px;
    background:#FFFFFF !important;
    color:#0D47A1 !important;
    border-radius:14px !important;
    border:2px solid #90CAF9 !important;
    font-weight:bold;
}

.item{
    background: linear-gradient(145deg,#FFFFFF,#E3F2FD) !important;
    color:#0D47A1 !important;
    padding:9px;
    margin:6px 0;
    border-radius:14px !important;
    cursor:pointer;
    transition:.25s ease;

    border-left:6px solid #DF301C;
}


/* Resaltado solo al pasar el mouse */
.item:hover{

    background:#00B7CD !important;

    color:#FFFFFF !important;

    transform:translateX(4px);

    box-shadow:
        0 6px 15px rgba(0,183,205,.45);

}


/* Estados de firma */
.item.realizada{
    border-left:6px solid #00A651 !important;
}

.item.pendiente{
    border-left:6px solid #DF301C !important;
}

/* =========================================
   MAPA Y MARCADORES
========================================= */
#map{position:absolute;top:80px;left:360px;right:0;bottom:0;z-index:1}

.cuaderno{
    width:34px;height:34px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    animation:flotar 1.8s infinite;font-size:18px;
}
.rojo{background:linear-gradient(#ef4444,#991b1b);box-shadow:0 0 15px red}
.verde{background:linear-gradient(#22c55e,#166534);box-shadow:0 0 15px green}
@keyframes flotar{50%{transform:translateY(-7px)}}

.exportar{
    position:absolute;right:15px;bottom:15px;z-index:3000;
    width:55px;height:32px;
}

/* =========================================
   EFECTOS DE PARTÍCULAS
========================================= */
.chispa, .cursorParticula{
    position:fixed;border-radius:50%;pointer-events:none;
}
.chispa{
    width:4px;height:4px;z-index:99999;
    background:radial-gradient(circle,#ffffff,#fde047,#f59e0b);
    box-shadow:0 0 6px #facc15,0 0 12px #fff;
    animation:particulaRapida .45s ease-out forwards;
}
@keyframes particulaRapida{
    0%{opacity:1;transform:translate(0,0) scale(1.8);}
    100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.1);}
}

.cursorParticula{
    width:6px;height:6px;z-index:999999;background:#facc15;
    box-shadow:0 0 8px #fff,0 0 15px #facc15;
    animation:salidaParticula .7s ease-out forwards;
}
@keyframes salidaParticula{
    0%{opacity:1;transform:translate(0,0) scale(1);}
    100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0);}
}

.destelloClick{
    position:fixed;width:15px;height:15px;border-radius:50%;
    border:2px solid #fde047;pointer-events:none;z-index:999998;
    animation:ondaClick .5s ease-out forwards;
}
@keyframes ondaClick{
    0%{opacity:1;transform:scale(.5)}
    100%{opacity:0;transform:scale(4)}
}

/* =========================================
   PANEL LATERAL DERECHO
========================================= */
#detalleLateral{
    position:fixed;top:0;right:-430px;width:400px;height:100vh;
    background:#0240c5;z-index:9999;box-shadow:-8px 0 30px rgba(0,0,0,.25);
    transition:right .35s ease;overflow-y:auto;font-family:Arial, sans-serif;
}
#detalleLateral.activo{ right:0; }

#cerrarDetalle{
    position:absolute;top:15px;right:15px;width:38px;height:38px;
    border:none;border-radius:50%;background:#111827 !important;
    color:white !important;font-size:25px;line-height:30px;
    cursor:pointer;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.3);
}

.detalleTitulo{ padding:22px 20px 15px; font-size:18px; font-weight:bold; color:#ffffff; }
.detalleImagen{ width:100%; height:270px; overflow:hidden; background:#e5e7eb; }
.detalleImagen img{ width:100%; height:100%; object-fit:cover; display:block; }
.detalleContenido{ padding:20px; }

.datoDetalle{
    padding:16px 0;border-bottom:1px solid #e5e7eb;
    display:flex;flex-direction:column;gap:6px;
}
.datoDetalle span{ font-size:11px; font-weight:bold; color:#ffffff; letter-spacing:.5px; }
.datoDetalle strong{ font-size:15px; color:#000000; line-height:1.4; }

.estadoPendiente{ color:#dc2626 !important; }
.estadoRealizada{ color:#16a34a !important; }

#detalleLateral.activo .detalleImagen img{ animation:entradaImagen .5s ease; }
@keyframes entradaImagen{
    from{opacity:0;transform:scale(1.05);}
    to{opacity:1;transform:scale(1);}
}
@media(max-width:700px){
    #detalleLateral{ width:90%; right:-95%; }
}
</style>
</head>

<img class="logo" src="logocentral.png">
<div class="titulo">CONTROL DE FIRMAS DE CUADERNO</div>
</header>

<button class="exportar" onclick="exportarPDF()">PDF</button>

    <div class="card">
        <h3>FIRMAS DE LA BASE</h3>
        <input class="buscar" id="buscar" placeholder="Buscar dirección...">
        <div id="lista"></div>
    </div>
</div>

<div id="map"></div>

<!-- PANEL LATERAL DE UBICACIÓN -->
<div id="detalleLateral">
    <button id="cerrarDetalle" onclick="cerrarDetalle()">×</button>
    <div class="detalleTitulo">DETALLE DE UBICACIÓN</div>
    <div class="detalleImagen">

        <img id="detalleImagen" src="serenafirma.png" alt="Imagen de ubicación">
    </div>
	<audio id="audioUbicacion" src="audioubicacion.mp3"></audio>
    <div class="detalleContenido">
        <div class="datoDetalle">
            <span>📍 DIRECCIÓN</span>
            <strong id="detalleDireccion">---</strong>
        </div>
        <div class="datoDetalle">
            <span>🏢 BASE</span>
            <strong id="detalleBase">---</strong>
        </div>
        <div class="datoDetalle">
            <span>🌐 COORDENADAS</span>
            <strong id="detalleCoordenadas">---</strong>
        </div>
        <div class="datoDetalle">
            <span>✍️ ESTADO</span>
            <strong id="detalleEstado">---</strong>
        </div>
    </div>
</div>

// ==========================================
// FUNCIONES DEL MAPA Y PANEL
// ==========================================
function mostrarDetalle(p){

    let imagen = document.getElementById("detalleImagen");
    imagen.src = p.imagen || "ubicacion_serenazgo.png";

    imagen.onclick = function(){

        let audio = document.getElementById("audioUbicacion");

        audio.currentTime = 0;
        audio.play();

    };
    document.getElementById("detalleDireccion").textContent = p.dir || "---";
    document.getElementById("detalleBase").textContent = p.base || "---";
    document.getElementById("detalleCoordenadas").textContent = p.lat + " , " + p.lng;
    
    let estado = document.getElementById("detalleEstado");
    if(p.ok){
        estado.textContent = "🟢 REALIZADA";
        estado.className = "estadoRealizada";
    }else{
        estado.textContent = "🔴 PENDIENTE";
        estado.className = "estadoPendiente";
    }
    document.getElementById("detalleLateral").classList.add("activo");
}

function cerrarDetalle(){
    document.getElementById("detalleLateral").classList.remove("activo");
}

let listaDiv = document.getElementById("lista");

function cargar(lista){
    actual=lista;
    capas.forEach(c=>map.removeLayer(c));
    capas=[];
    listaDiv.innerHTML="";

    // Ordenar: pendientes primero
    lista = [...lista].sort((a,b)=>{
        let estadoA = a.ok ? 1 : 0;
        let estadoB = b.ok ? 1 : 0;
        return estadoA - estadoB;
    });

    lista.forEach(p=>{
        // Para que se vea bonito, si no tienes la imagen "sereno.png" localmente, puedes quitar el <img...> y poner un emoji como 👮🏻
        let icon=L.divIcon({className:"",html:`<div class="cuaderno ${p.ok?"verde":"rojo"}"><img src="sereno.png" style="width:40px;height:40px;object-fit:contain;"></div>`});
        let m=L.marker([p.lat,p.lng],{icon}).addTo(map);
        m.bindPopup(`<b>${p.base}</b><br>${p.dir}<br>${p.ok?"🟢 REALIZADA":"🔴 PENDIENTE"}`);
        
        m.on("click", function(){ mostrarDetalle(p); });
        capas.push(m);

        listaDiv.innerHTML+=`<div class="item ${p.ok?"realizada":"pendiente"}" onclick="cambiar(${datos.indexOf(p)})">${p.dir}<br><b>${p.ok?"REALIZADA":"PENDIENTE"}</b></div>`;
    });

    resumen(lista);
}

function resumen(l){
    let r=l.filter(x=>x.ok).length;
    document.getElementById("total").textContent=l.length;
    document.getElementById("real").textContent=r;
    document.getElementById("pend").textContent=l.length-r;
    document.getElementById("avance").textContent=l.length?Math.round(r/l.length*100)+"%":"0%";
}

function cambiar(i){
    datos[i].ok = !datos[i].ok;
    cargar(actual);
}

function seleccionar(b){
    let l=datos.filter(x=>x.base==b);
    cargar(l);
    if(l.length > 0){
        map.fitBounds(L.latLngBounds(l.map(x=>[x.lat,x.lng])),{padding:[50,50]});
    }
}

function todos(){ cargar(datos); }

// ==========================================
// BUSCADOR Y EXPORTACIÓN PDF
// ==========================================
document.getElementById('buscar').addEventListener('input',function(){
    let t = this.value
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'')
        .trim();

    // Si se borra el texto vuelve a mostrar todas las direcciones
    if(t === ''){
        cargar(datos);
        return;
    }

    // Buscar siempre en TODAS las direcciones, no solo en el filtro actual
    let resultados = datos.filter(x=>{
        let texto = (x.base + ' ' + x.dir)
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g,'');

        return texto.includes(t);
    });

    cargar(resultados);
});

function exportarPDF(){
    let zonas={};
    datos.forEach(x=>{
        if(!zonas[x.base]){
            zonas[x.base]={total:0,real:0,pedientes:[]};
        }
        zonas[x.base].total++;
        if(x.ok){
            zonas[x.base].real++;
        }else{
            zonas[x.base].pedientes.push(x.dir);
        }
    });

    let html=`
    <!DOCTYPE html>
    <html>
    <head>
    <meta charset="UTF-8">
    <title>Reporte Control de Firmas</title>
    <style>
    body{font-family:Arial;margin:35px;color:#111}
    h1{text-align:center;font-size:24px}
    .fecha{text-align:right;font-size:11px}
    table{width:100%;border-collapse:collapse;margin-top:15px}
    th{background:#0D47A1;color:white;padding:8px}
    td{border:1px solid #999;padding:7px;text-align:center}
    .pend{text-align:left; color:#DF301C; font-weight:bold;}
    </style>
    </head>
    <body>
    <div class="fecha">Fecha: ${new Date().toLocaleString()}</div>
    <h1>Control de Firmas de Cuaderno</h1>
    
    <h2>Resumen por zona</h2>
    <table>
    <tr><th>Zona</th><th>Total</th><th>Realizadas</th><th>Pendientes</th><th>Avance</th></tr>`;
    
    Object.keys(zonas).forEach(z=>{
        let d=zonas[z];
        let avance=d.total?Math.round((d.real/d.total)*100):0;
        html+=`<tr><td>${z}</td><td>${d.total}</td><td>${d.real}</td><td>${d.total-d.real}</td><td>${avance}%</td></tr>`;
    });
    
    html+=`
    </table>
    
    <h2>Pendientes por firmar</h2>
    <table>
    <tr><th>Zona</th><th>Dirección pendiente</th></tr>`;
    
    Object.keys(zonas).forEach(z=>{
        zonas[z].pedientes.forEach(dir=>{
            html+=`<tr><td>${z}</td><td class="pend">${dir}</td></tr>`;
        });
    });
    
    html+=`</table></body></html>`;

    let w=window.open("");
    w.document.write(html);
    w.document.close();
    w.onload=function(){
        w.print();
    };
}

// ==========================================
// EFECTOS VISUALES AL CLIC
// ==========================================
document.addEventListener("click", function(e){
    // Ignorar clics en el mapa o botones para no saturar
    if(e.target.tagName === 'BUTTON' || e.target.closest('#map')) return;

    let onda=document.createElement("div");
    onda.className="destelloClick";
    onda.style.left=(e.clientX-8)+"px";
    onda.style.top=(e.clientY-8)+"px";
    document.body.appendChild(onda);

    for(let i=0;i<12;i++){
        let p=document.createElement("span");
        p.className="cursorParticula";
        p.style.left=e.clientX+"px";
        p.style.top=e.clientY+"px";
        
        let x=(Math.random()-0.5)*160;
        let y=(Math.random()-0.5)*160;
        p.style.setProperty("--tx",x+"px");
        p.style.setProperty("--ty",y+"px");
        
        document.body.appendChild(p);
        setTimeout(()=>p.remove(),700);
    }
    setTimeout(()=>onda.remove(),500);
});
